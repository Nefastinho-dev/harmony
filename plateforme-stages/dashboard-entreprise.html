<!DOCTYPE html>
<html lang="fr" class="h-full bg-gray-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace Recruteur — StageAvenir</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body class="flex flex-col min-h-full">

  <header class="bg-white border-b border-gray-100">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="font-bold text-xl text-gray-900">Stage<span class="text-blue-600">Avenir</span> <span class="text-xs px-2 py-0.5 bg-gray-100 rounded text-gray-600">Pro</span></a>
      <div id="nav-auth-buttons"></div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full space-y-8">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Gestion des offres & candidatures</h1>
        <p class="text-sm text-gray-500">Entreprise : TechLab Studio (SIRET Verified)</p>
      </div>
      <button onclick="alert('Ouverture du formulaire de création d\'offre')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm px-4 py-2 rounded-lg">+ Publier une offre</button>
    </div>

    <!-- Board Candidatures reçues -->
    <div class="bg-white rounded-xl border border-gray-100 p-6 space-y-4">
      <h2 class="font-bold text-gray-900">Candidatures reçues</h2>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- Candidat Item -->
        <div class="border border-gray-200 p-4 rounded-xl space-y-3 bg-gray-50/50">
          <div class="flex justify-between items-start">
            <div>
              <p class="font-bold text-gray-900 text-sm">Lucas M.</p>
              <p class="text-xs text-gray-500">Élève de 3ème</p>
            </div>
            <span class="px-2 py-0.5 bg-blue-100 text-blue-800 text-xs rounded">Nouveau</span>
          </div>
          <p class="text-xs text-gray-600">"Très passionné par le code HTML..."</p>
          <div class="flex gap-2 pt-2">
            <button class="flex-1 bg-emerald-600 text-white text-xs py-1.5 rounded font-semibold hover:bg-emerald-700">Accepter</button>
            <button class="flex-1 bg-gray-200 text-gray-700 text-xs py-1.5 rounded font-semibold hover:bg-gray-300">Refuser</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
