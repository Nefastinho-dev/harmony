<!DOCTYPE html>
<html lang="fr" class="h-full bg-gray-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion / Inscription — StageAvenir</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js" defer></script>
</head>
<body class="flex items-center justify-center min-h-full py-12 px-4">

  <div class="max-w-md w-full bg-white p-8 rounded-2xl border border-gray-100 shadow-xl space-y-6">
    <div class="text-center">
      <a href="index.html" class="font-bold text-2xl text-gray-900">Stage<span class="text-blue-600">Avenir</span></a>
      <h2 class="mt-2 text-lg font-bold text-gray-800">Accéder à votre compte</h2>
    </div>

    <!-- Toggle Role -->
    <div class="flex p-1 bg-gray-100 rounded-xl text-sm font-semibold">
      <button id="btn-student" onclick="setRole('student')" class="flex-1 py-2 rounded-lg bg-white shadow-sm text-blue-600">Élève</button>
      <button id="btn-company" onclick="setRole('company')" class="flex-1 py-2 rounded-lg text-gray-500">Entreprise</button>
    </div>

    <form id="auth-form" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Email</label>
        <input type="email" required class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Mot de passe</label>
        <input type="password" required class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-500">
      </div>

      <!-- Champ conditionnel entreprise -->
      <div id="company-field" class="hidden">
        <label class="block text-xs font-semibold text-gray-600 mb-1">Numéro SIRET</label>
        <input type="text" placeholder="14 chiffres" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-blue-500">
      </div>

      <button type="submit" class="w-full py-3 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 transition text-sm">Se connecter</button>
    </form>
  </div>

  <script>
    let currentRole = 'student';
    function setRole(role) {
      currentRole = role;
      const btnStudent = document.getElementById('btn-student');
      const btnCompany = document.getElementById('btn-company');
      const companyField = document.getElementById('company-field');

      if(role === 'student') {
        btnStudent.className = 'flex-1 py-2 rounded-lg bg-white shadow-sm text-blue-600';
        btnCompany.className = 'flex-1 py-2 rounded-lg text-gray-500';
        companyField.classList.add('hidden');
      } else {
        btnCompany.className = 'flex-1 py-2 rounded-lg bg-white shadow-sm text-blue-600';
        btnStudent.className = 'flex-1 py-2 rounded-lg text-gray-500';
        companyField.classList.remove('hidden');
      }
    }

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      alert('Connexion simulée réussie ! Redirecting...');
      window.location.href = currentRole === 'student' ? 'dashboard-eleve.html' : 'dashboard-entreprise.html';
    });
  </script>
</body>
</html>
